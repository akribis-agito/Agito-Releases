; Machine settings shared by the 03-config samples (C# and Python).
; Change the controller and the motion here, not in the code.

[controller]
; an IP address, or the absolute path of firmware_sim.exe
target = 172.1.1.101
model = AGM800
; command timeout in ms (10 to 60000)
timeout = 2000

[motion]
axis = A
distance = 10000
speed = 20000
accel = 200000
